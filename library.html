<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>帧词库 · 这一帧怎么说</title>
    <link rel="stylesheet" href="/library.css" />
  </head>
  <body>
    <header class="lib-header">
      <a class="lib-brand" href="/"><span class="brand-mark">帧</span><b>这一帧怎么说</b></a>
      <nav class="lib-nav" aria-label="主导航">
        <a href="/how-it-works">如何工作</a>
        <a class="active" href="/library">帧词库</a>
        <a class="nav-cta" href="/app">体验一下</a>
      </nav>
    </header>

    <main class="lib-main">
      <section class="lib-status" id="libStatus" role="status" aria-live="polite">
        <span id="libStatusMark">↻</span>
        <h1 id="libStatusTitle">正在找回你的帧词库</h1>
        <p id="libStatusCopy">画面、表达和复习进度会保存在你的匿名学习账户里。</p>
        <button id="libRetry" hidden>重新加载</button>
      </section>

      <section class="lib-empty" id="libEmpty" hidden>
        <span class="empty-mark">帧</span>
        <h1>帧词库还是空的。</h1>
        <p>去暂停一条你正在看的视频，<br />把你看见却不会说的表达收进来。</p>
        <a class="primary-cta" href="/app">暂停这一帧 →</a>
      </section>

      <section class="lib-content" id="libContent" hidden>
        <div class="lib-stats">
          <div><b id="statDue">0</b><small>今日待复习</small></div>
          <div><b id="statTotal">0</b><small>已收集表达</small></div>
          <div><b id="statScenes">0</b><small>段视频</small></div>
        </div>

        <div class="lib-actions" id="libActions">
          <button class="review-start" id="reviewStart">开始复习</button>
        </div>

        <div class="scene-groups" id="sceneGroups"></div>
      </section>
    </main>

    <section class="review-mode" id="reviewMode" aria-hidden="true">
      <header class="review-top">
        <button id="reviewExit" aria-label="退出复习">×</button>
        <span id="reviewProgress">1 / 3</span>
      </header>
      <div class="review-card" id="reviewCard">
        <figure class="review-frame">
          <img id="reviewImage" alt="单词来源画面" />
          <span class="review-scene" id="reviewScene"></span>
        </figure>
        <p class="review-prompt" id="reviewPrompt">你还记得这个表达吗？</p>
        <div class="review-answer" id="reviewAnswer" hidden>
          <b id="reviewWord"></b>
          <span id="reviewMeta"></span>
          <p id="reviewMeaning"></p>
          <p class="review-context" id="reviewContext" hidden></p>
          <small class="review-context-translation" id="reviewContextTranslation" hidden></small>
          <div class="review-speech-actions">
            <button class="review-speak" id="reviewSpeak">♪ 朗读表达</button>
            <button class="review-speak" id="reviewSpeakExample">▶ 朗读例句</button>
          </div>
        </div>
        <button class="review-reveal" id="reviewReveal">显示表达</button>
        <div class="review-grade" id="reviewGrade" hidden>
          <button class="grade-again" id="gradeAgain">再看看</button>
          <button class="grade-known" id="gradeKnown">认识</button>
        </div>
      </div>
      <div class="review-done" id="reviewDone" hidden>
        <h2>今天的复习完成了。</h2>
        <p id="reviewDoneCopy">以后再见到它，你会知道怎么说。</p>
        <a class="primary-cta" href="/app">继续收集表达 →</a>
      </div>
    </section>

    <script src="/library.js"></script>
  </body>
</html>
